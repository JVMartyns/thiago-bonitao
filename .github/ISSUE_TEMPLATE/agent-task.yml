name: Agent-ready task
description: A fully specified unit of work that a human or AI agent can implement without follow-up questions.
title: "<type>(<scope>): <imperative summary>"
labels: ["needs-human"]
body:
  - type: markdown
    attributes:
      value: |
        Write this as a spec. See `docs/06-issue-driven-agentic-development.md` §2.
        New issues start as `needs-human` (triage). Add `type:*`, `area:*` and `size:S|M` labels,
        then swap `needs-human` for `agent:ready` only when the Definition of Ready is met.
        Dependencies are not a form field: after creating the issue, use **Relationships → Mark as
        blocked by** in the sidebar (or `gh issue edit <N> --add-blocked-by <M>`).
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome in 1–2 sentences (what and why, not how).
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to rules in docs/01 (R1–R7, A1–A8), related issues, relevant files.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable checkboxes. Each one should become at least one test.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        **In scope:**
        -

        **Out of scope:**
        -
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely touched
      placeholder: lib/token_system/tokens/manager.ex, test/token_system/tokens/manager_test.exs
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Allowed libraries, patterns to follow, things not to do.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      value: |
        - `mix precommit` passes
    validations:
      required: true
